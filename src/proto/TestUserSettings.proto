syntax = "proto3";

message TestUserSettings {
  message Versions {
    uint32 client_version = 1;
    uint32 server_version = 2;
    uint32 data_version = 3;
  }

  message ClientMod {
    bytes data = 1;
  }

  message ClientSettings {
    ClientMod shared = 1;
    ClientMod vencord = 2;
  }

  optional Versions versions = 1;
  optional ClientSettings settings = 2;
}
